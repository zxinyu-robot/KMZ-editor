[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uavplanner"
version = "0.1.0"
description = "KMZ export (route_3d + options) migrated from drone_3d_path"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pyproj>=3.5",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["uavplanner*"]
